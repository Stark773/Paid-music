general_4 : "» আপনার ভিডিও চ্যাট পরিচালনার অনুমতি নেই।\n\n/reload দিয়ে অ্যাডমিন ক্যাশ রিফ্রেশ করুন।"
general_5 : "» বট ভিডিওচ্যাটে স্ট্রিমিং করছে না।"

