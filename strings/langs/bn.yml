name : 🇧🇩 বাংলা

general_1 : "» একজন ব্যবহারকারীর বার্তা রিপ্লাই করুন অথবা ইউজারনেম/ইউজার আইডি দিন।"
general_2 : "» আপনার অনুরোধ প্রক্রিয়া করতে সমস্যা হয়েছে।\n\nত্রুটি: <code>{0}</code>"
